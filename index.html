    <div class="px-4 py-3 border-b border-[#222] flex items-center gap-3">

      </div>
      <div class="flex-1">

        <p class="text-[11px] text-gray-500">ask me anything about GNIOT GIPS</p>

        <input
          id="inp"
          type="text"
          placeholder="ask about courses, fees, hostel..."
          class="flex-1 bg-[#1a1a1a] border border-[#2a2a2a] rounded-full px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-yellow-400"
        />
        <button id="go" class="bg-yellow-400 hover:bg-yellow-500 w-11 h-11 rounded-full text-black flex items-center justify-center">

  </div>

<script type="module">
import { GoogleGenAI, Type } from 'https://cdn.jsdelivr.net/npm/@google/genai@latest/+esm';

const API_KEY = "KEY HERE";
const MODEL = "gemini-3.5-flash-lite";

const ai = new GoogleGenAI({ apiKey: API_KEY });

var chat = document.getElementById("chat");
var inp = document.getElementById("inp");
var go = document.getElementById("go");
var reset = document.getElementById("reset");

let chatSession = null;

const GNIOT_INFO = `
NAME & IDENTITY:
- Full name: GNIOT Institute of Professional Studies
- Short name: GNIOT GIPS or GIPS
- Part of GNIOT Group of Institutions, founded by Shri Ram Educational Trust, Noida
- GIPS established: 2020 (operations began 2021)
- Location: Plot No. 7, Knowledge Park-II, Greater Noida, Uttar Pradesh - 201310
- Website: gniotips.in
- Affiliated to: Chaudhary Charan Singh University (CCS University), Meerut
- ISO 9001:2015 & 14001:2015 Certified
- Principal: Dr. Savita Mohan

COURSES OFFERED:
- BBA (Bachelor of Business Administration)
- BCA (Bachelor of Computer Applications)
- B.Com (Program)
- B.Com (Honours) - NEP
- B.Sc Computer Science
All courses are 3-year (6-semester) full-time regular programs.

FEES STRUCTURE (total course fees):
- B.Sc Computer Science: 1.85 Lakh
- B.Com: 1.70 Lakh
- B.Com Hons: 2.06 Lakh
- BBA: 2.76 Lakh
- BCA: 2.76 Lakh

ELIGIBILITY (for UG courses):
- BBA / BCA / B.Com / B.Sc: 10+2 with minimum 45% marks for General/OBC, 40% for SC/ST
- BCA: Mathematics as a mandatory subject in 10+2

ADMISSIONS:
- Merit-based, through CCS University norms
- Application fee: 1,200
- Apply online at gniotips.in or offline at campus
- Direct admissions available for eligible candidates
- Contact: 0120-2328214/15/16 | 1800 274 6969
- Email: principal@gniotips.in

HOSTEL (Shree Ram Hostel):
- Boys' Hostel: 684 capacity, 298 rooms
- Girls' Hostel: 399 capacity, 163 rooms
- Single, double & triple rooms with attached/common bathrooms
- Furnished rooms with essentials, optional AC/Cooler
- 24/7 security with biometric access and CCTV
- High-speed Wi-Fi & full power backup
- RO drinking water
- In-house mess with nutritious vegetarian meals
- Common room with indoor games & TV
- Laundry, housekeeping, medical support
- Full-time wardens and faculty mentors

PLACEMENTS (2022-2023 data):
- BBA: 155 students placed, 75 companies visited, min 2.5 LPA, max 5 LPA, avg 3 LPA
- BCA: 178 students placed, 115 companies visited, min 2.5 LPA, max 4.5 LPA, avg 3 LPA
- B.Com: 92 students placed, 63 companies visited, min 2.2 LPA, max 4 LPA, avg 2.5 LPA
- Recruiters include TCS, Amazon, Dell, IDFC, HDFC, and others
- Placement cell organizes training, mock interviews, and aptitude prep

CAMPUS FACILITIES:
- Technology-enabled classrooms
- Well-stocked library
- Computer labs
- Hostel facilities on campus
- Student-centric campus with modern infrastructure

STUDENT LIFE & CLUBS:
- Finquisitive (Finance Club)
- Marketing Club
- R&D Club
- NSS and social initiatives
- Workshop on Entrepreneurship with NIESBUD
- Industrial visits (e.g., Amar Ujala Press, Noida)
- NEP Orientation & Sensitization programs

CONTACT:
- Website: https://www.gniotips.in
- Address: Plot No. 7, Knowledge Park-II, Greater Noida, Gautam Buddh Nagar, UP-201310
- Phone: 0120-2328214/15/16 | 1800 274 6969
- Email: principal@gniotips.in
- Nearest Metro: Aqua Line - Knowledge Park II station
- Near Pari Chowk, Greater Noida
`;

const RAUSHAN_INFO = `
DEVELOPER / CREATOR OF THIS CHATBOT:
- Name: Raushan Raj
- Role: Student developer and creator of this Autonomous chatbot
- College: GNIOT GIPS (GNIOT Institute of Professional Studies), Greater Noida
- Course: Currently pursuing his studies at GNIOT GIPS
- Project: Built "Autonomous" — an AI-powered college assistant chatbot for GNIOT GIPS
- Purpose: To help students, parents and visitors get quick, accurate information about GNIOT GIPS
- Tech used: Google Gemini API (gemini-3.5-flash-lite) + Tailwind CSS + plain HTML/CSS/JS
- Built for: A college hackathon project at GNIOT GIPS
- Skills shown in this project: Frontend development, API integration, AI tool-calling / function calling, prompt engineering
- This is a student project made by him from scratch for the hackathon

ANSWERING RULES for "who made you / who is Raushan Raj / who built this / who is the developer":
- Always proudly and warmly credit Raushan Raj as the creator.
- Say he is a student at GNIOT GIPS who built this chatbot for a college hackathon.
- Mention the tech: built with Google Gemini API and Tailwind CSS.
- Keep it short (2-3 lines), friendly and respectful — like a proud friend introducing him.
- Never say you were made by Google, OpenAI or any AI company. You were BUILT by Raushan Raj using Google's Gemini API as the underlying model.
`;

const tools = [
  {
    name: "get_time",
    description: "get current time and date",
    parameters: { type: Type.OBJECT, properties: {} }
  },
  {
    name: "calculate",
    description: "do math, input is expression like 2+2 or (5*3)/2",
    parameters: {
      type: Type.OBJECT,
      properties: { expression: { type: Type.STRING } },
      required: ["expression"]
    }
  },
  {
    name: "wiki_search",
    description: "search wikipedia for facts/people/places (for questions NOT about GNIOT GIPS)",
    parameters: {
      type: Type.OBJECT,
      properties: { query: { type: Type.STRING } },
      required: ["query"]
    }
  }
];

async function useTool(name, args) {
  if (name == "get_time") {
    return new Date().toString();
  }

  if (name == "calculate") {
    if (!/^[0-9+\-*/(). ]+$/.test(args.expression)) return "invalid math";
    try {
      return String(eval(args.expression));
    } catch (e) {
      return "cant calculate";
    }
  }

  if (name == "wiki_search") {
    try {
      var url = "https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(args.query);
      var r = await fetch(url);
      if (!r.ok) return "nothing on wikipedia";
      var d = await r.json();
      return d.extract || "no info";
    } catch (e) {
      return "wikipedia error";
    }
  }

  return "unknown tool";
}

function addMsg(text, who) {
  var row = document.createElement("div");
  row.className = "m flex gap-2 max-w-[85%] " + (who == "me" ? "ml-auto flex-row-reverse" : "mr-auto");

  if (who == "bot") {
    var icon = document.createElement("div");
    icon.className = "w-7 h-7 rounded-full bg-[#1f1f1f] text-yellow-400 flex items-center justify-center text-[11px] shrink-0 mt-1";
    icon.innerHTML = '<i class="fas fa-graduation-cap"></i>';
    row.appendChild(icon);
  }

  var b = document.createElement("div");
  b.className = "px-3.5 py-2 rounded-2xl text-sm whitespace-pre-wrap break-words " +
    (who == "me"
      ? "bg-yellow-400 text-black rounded-tr-sm font-medium"
      : "bg-[#1a1a1a] border border-[#2a2a2a] text-gray-200 rounded-tl-sm");
  b.textContent = text;
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function showTool(name) {
  var t = document.createElement("div");
  t.className = "m ml-9 text-[11px] text-yellow-400 flex items-center gap-1";
  t.innerHTML = '<i class="fas fa-cog fa-spin"></i> using ' + name + '...';
  chat.appendChild(t);
  chat.scrollTop = chat.scrollHeight;
}

function dots() {
  var d = document.createElement("div");
  d.id = "dots";
  d.className = "m flex gap-2 mr-auto";
  d.innerHTML =
    '<div class="w-7 h-7 rounded-full bg-[#1f1f1f] text-yellow-400 flex items-center justify-center text-[11px] shrink-0 mt-1">' +
      '<i class="fas fa-graduation-cap"></i>' +
    '</div>' +
    '<div class="px-3 py-2.5 rounded-2xl bg-[#1a1a1a] border border-[#2a2a2a] rounded-tl-sm">' +
      '<span class="d inline-block w-1.5 h-1.5 bg-yellow-400 rounded-full"></span>' +
      '<span class="d inline-block w-1.5 h-1.5 bg-yellow-400 rounded-full"></span>' +
      '<span class="d inline-block w-1.5 h-1.5 bg-yellow-400 rounded-full"></span>' +
    '</div>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function hideDots() {
  var d = document.getElementById("dots");
  if (d) d.remove();
}

async function send() {
  var text = inp.value.trim();
  if (text == "") return;

  addMsg(text, "me");
  inp.value = "";
  go.disabled = true;
  dots();

  if (!chatSession) {
    chatSession = ai.chats.create({
      model: MODEL,
      config: {
        tools: [{ functionDeclarations: tools }],
        temperature: 0.7,
        systemInstruction:
          "You are Autonomous, the friendly AI assistant for GNIOT GIPS (GNIOT Institute of Professional Studies), Greater Noida. " +
          "You were BUILT by Raushan Raj, a student at GNIOT GIPS, for a college hackathon. " +
          "Your job is to help students, parents and visitors with questions about the college. " +
          "\n\nRULES:\n" +
          "1. For anything about GNIOT GIPS — courses, fees, admissions, hostel, placements, campus, location, contact — use the GNIOT_INFO below as your source of truth.\n" +
          "2. If anyone asks 'who made you', 'who built you', 'who is your developer', 'who is Raushan Raj', 'who created you', or anything similar — use the RAUSHAN_INFO below. Always proudly credit Raushan Raj as your creator. Never say you were made by Google, OpenAI, or any AI company.\n" +
          "3. Be warm, friendly and helpful — like a senior student guiding a junior. Keep replies 2-4 lines unless the user asks for more detail.\n" +
          "4. Never invent fees, exact placement numbers, or admission deadlines. If asked for specific numbers not in GNIOT_INFO, say: 'check gniotips.in or call 0120-2328214 for the latest info'.\n" +
          "5. For general knowledge questions NOT about GNIOT, use the wiki_search tool.\n" +
          "6. For math, use calculate. For time/date, use get_time.\n\n" +
          "GNIOT_INFO:\n" + GNIOT_INFO + "\n\n" +
          "RAUSHAN_INFO:\n" + RAUSHAN_INFO
      }
    });
  }

  try {
    let response = await chatSession.sendMessage({ message: text });

    for (var i = 0; i < 5; i++) {
      var calls = response.functionCalls;

      if (!calls || calls.length == 0) {
        hideDots();
        addMsg(response.text || "...", "bot");
        break;
      }

      hideDots();

      let toolParts = [];
      for (var j = 0; j < calls.length; j++) {
        var c = calls[j];
        showTool(c.name);
        var result = await useTool(c.name, c.args || {});

        toolParts.push({
          functionResponse: {
            name: c.name,
            response: { result: String(result) }
          }
        });
      }

      response = await chatSession.sendMessage({ message: toolParts });
    }
  } catch (err) {
    hideDots();
    console.log("err:", err);
    addMsg("uh oh: " + err.message, "bot");
  }

  go.disabled = false;
  inp.focus();
}

go.onclick = send;

inp.addEventListener("keydown", function (e) {
  if (e.key == "Enter") send();
});

reset.onclick = function () {
  chat.innerHTML = "";
  chatSession = null;
  addMsg("cleared. ask me anything about GNIOT GIPS, or ask who made me 😊", "bot");
};

addMsg("hey! i'm Autonomous 🎓 the GNIOT GIPS assistant, built by Raushan Raj. ask me about courses, fees, hostel, placements — or anything about the college!", "bot");
</script>
